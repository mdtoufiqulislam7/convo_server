name: Private Build & Deploy to AWS EC2 (No Docker Hub)

on:
  push:
    branches:
      - main
      - master

env:
  IMAGE_NAME: convo-server
  TARGET_DIR: /home/toufiqpc/convoai

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Build & Deploy Docker Container on AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting Deployment on Server..."

            # 1. Navigate to target directory
            cd ${{ env.TARGET_DIR }}

            # 2. Pull latest code from GitHub repository
            git pull origin main || git pull origin master

            # 3. Build Docker image directly on server (100% Private, No Docker Hub!)
            docker build -t ${{ env.IMAGE_NAME }}:latest .

            # 4. Stop and remove existing container if running
            docker stop ${{ env.IMAGE_NAME }} || true
            docker rm ${{ env.IMAGE_NAME }} || true

            # 5. Run new container with production .env file
            docker run -d \
              --name ${{ env.IMAGE_NAME }} \
              --restart unless-stopped \
              --add-host=host.docker.internal:host-gateway \
              -p 5000:5000 \
              --env-file ${{ env.TARGET_DIR }}/.env \
              ${{ env.IMAGE_NAME }}:latest

            # 6. Clean up old dangling images
            docker image prune -f

            echo "✅ Deployment completed successfully!"




